server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres-db:5432/userdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  web:
    cors:
      allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.vandan.userservice: DEBUG
