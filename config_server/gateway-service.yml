server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

management:
  endpoints:
    web:
      exposure:
        include: health